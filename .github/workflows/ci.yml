name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      upload_packages:
        description: Store verified packages and reports for one day
        type: boolean
        default: false
      upload_release:
        description: Store verified release downloads and reports, without duplicate application/source caches
        type: boolean
        default: false
      upgrade_from:
        description: Optional full main ancestor SHA for cross-version installer verification
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/windows-py312.lock
      - name: Install hashed environment and editable app
        run: ./scripts/setup.ps1
      - name: Complete test and quality gate
        run: ./scripts/test.ps1

  security:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/audit-windows-py312.lock
      - name: Public source and redacted full-history scan
        run: |
          python scripts/public_safety_audit.py
          ./scripts/scan-secrets.ps1
      - name: Audit locked third-party dependencies
        run: ./scripts/audit-dependencies.ps1

  windows-package:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/windows-py312.lock
      - name: Install hashed build environment
        run: ./scripts/setup.ps1
      - name: Build, legal/source audit and smoke checks
        run: ./scripts/build.ps1 -SkipQualityChecks -OutputDirectory dist/ci
      - name: Verify upgrade from the previous installed version
        if: github.event_name == 'workflow_dispatch' && inputs.upgrade_from != ''
        shell: pwsh
        env:
          PREVIOUS_COMMIT: ${{ inputs.upgrade_from }}
        run: |
          if ($env:PREVIOUS_COMMIT -cnotmatch '^[0-9a-f]{40}$' -or
              $env:PREVIOUS_COMMIT -eq $env:GITHUB_SHA) {
            throw "Expected a full previous commit SHA."
          }
          git fetch --unshallow --no-tags origin main
          if ($LASTEXITCODE -ne 0) { throw "Could not fetch main history." }
          git merge-base --is-ancestor $env:PREVIOUS_COMMIT HEAD
          if ($LASTEXITCODE -ne 0) { throw "The previous commit is not an ancestor." }
          $previousRoot = Join-Path $env:RUNNER_TEMP "wuwa-previous"
          git worktree add --detach $previousRoot $env:PREVIOUS_COMMIT
          if ($LASTEXITCODE -ne 0) { throw "Could not check out the previous commit." }
          Push-Location $previousRoot
          try {
            ./scripts/setup.ps1
            ./scripts/build.ps1 -SkipQualityChecks -OutputDirectory dist/previous
            $previous = (Get-Item dist/previous/*-Setup.exe).FullName
          } finally {
            Pop-Location
          }
          ./scripts/verify-installer.ps1 -Installer (Get-Item dist/ci/*-Setup.exe).FullName -PackageRoot (Resolve-Path dist/ci/WuwaDisplayAssistant).Path -PreviousInstaller $previous
          ./.venv/Scripts/python.exe scripts/release_assets.py --output-directory dist/ci
          if ($LASTEXITCODE -ne 0) { throw "Could not refresh verified release reports." }
      - name: Record packaging verification
        shell: pwsh
        run: |
          "Windows packaging and smoke checks passed for $env:GITHUB_SHA." >> $env:GITHUB_STEP_SUMMARY

      - name: Preserve package verification
        if: github.event_name == 'workflow_dispatch' && (inputs.upload_packages || inputs.upload_release)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-package-reports-${{ github.sha }}
          path: dist/ci/reports/*.json
          if-no-files-found: warn
          retention-days: 1
      - name: Preserve verified application
        if: github.event_name == 'workflow_dispatch' && inputs.upload_packages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: WuwaDisplayAssistant-windows-${{ github.sha }}
          path: dist/ci/WuwaDisplayAssistant/
          if-no-files-found: error
          retention-days: 1
      - name: Preserve complete corresponding sources
        if: github.event_name == 'workflow_dispatch' && inputs.upload_packages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: corresponding-sources-${{ github.sha }}
          path: |
            dist/ci/ThirdPartySources-1.1.2.zip
            dist/ci/certifi-*.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Preserve installer and portable downloads
        if: github.event_name == 'workflow_dispatch' && (inputs.upload_packages || inputs.upload_release)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-downloads-${{ github.sha }}
          path: |
            dist/ci/*-Setup.exe
            dist/ci/*-windows-x64.zip
            dist/ci/VerificationReports-*.zip
            dist/ci/SHA256SUMS.txt
            dist/ci/certifi-*.tar.gz
          if-no-files-found: error
          retention-days: 1
