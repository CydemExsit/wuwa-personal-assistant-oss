name: Bug report / 問題回報
description: 回報可重現問題，請勿上傳私人資料
body:
  - type: markdown
    attributes:
      value: "勿附私人截圖、資料庫、備份、完整日誌或 token。安全／隱私漏洞先讀 SECURITY.md。只貼手動遮蔽的必要文字。"
  - type: input
    id: version
    attributes:
      label: App version / commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows、單／雙螢幕、遊戲解析度、Windows縮放比例
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 重現步驟、預期與實際結果
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隱私檢查
      options:
        - label: 已確認沒有個人資料、憑證、資料庫或私人畫面。
          required: true
